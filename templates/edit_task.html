{% extends "base.html" %}

{% block title %}Edit Task{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-7">

        <div class="card">

            <div class="card-body p-5">

                <h2>Edit Task</h2>

                <p class="text-muted mb-4">
                    Update your task details below.
                </p>

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Task Title
                        </label>

                        <input
                            type="text"
                            name="title"
                            value="{{ task.title }}"
                            class="form-control"
                            required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            name="description"
                            rows="5"
                            class="form-control">{{ task.description }}</textarea>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary">

                        Update Task

                    </button>

                    <a
                        href="/dashboard"
                        class="btn btn-light ms-2">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
