{% extends "base.html" %}

{% block title %}Add Task{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-7">

        <div class="card">

            <div class="card-body p-5">

                <h2>Add New Task</h2>

                <p class="text-muted mb-4">
                    Fill in the details below to create a new task.
                </p>

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Task Title
                        </label>

                        <input
                            type="text"
                            name="title"
                            class="form-control"
                            required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            name="description"
                            rows="5"
                            class="form-control"></textarea>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary">

                        Save Task

                    </button>

                    <a
                        href="/dashboard"
                        class="btn btn-light ms-2">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
